name: Tests

on:
  push:
    branches: [main, bugs-revision]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run test suite
        # the DIDONE-corpus regression skips automatically when the corpus
        # is not available (as in CI)
        run: pytest tests/ -v
